<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In / Sign Up</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            min-height:100vh;
           /* background:#101010;*/
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial, Helvetica, sans-serif;
        }

        /* MAIN BOX */

        .container{
            width:780px;
            height:390px;
            display:flex;
            background:white;
            overflow:hidden;
        }

        /* LEFT SIDE */

        .signin{
            width:50%;
            background:#fff;
            text-align:center;
            padding:50px 55px;
        }

        .signin h1{
            font-size:30px;
            margin-bottom:18px;
            color:#111;
        }

        /* SOCIAL ICONS */

        .social{
            display:flex;
            justify-content:center;
            gap:15px;
            margin-bottom:17px;
        }

        .social a{
            width:32px;
            height:32px;
            border:1px solid #ddd;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            text-decoration:none;
            font-weight:bold;
            color:#555;
            font-size:14px;
        }

        .social a:hover{
            background:#ff4b2b;
            color:white;
        }

        .account-text{
            color:#777;
            font-size:12px;
            margin-bottom:12px;
        }

        /* INPUTS */

        .input{
            width:100%;
            height:34px;
            margin-bottom:13px;
            border:none;
            background:#edf0f4;
            padding:0 13px;
            outline:none;
            font-size:11px;
        }

        .forgot{
            display:block;
            color:#555;
            font-size:12px;
            text-decoration:none;
            margin:4px 0 12px;
        }

        /* BUTTON */

        .btn{
            width:122px;
            height:35px;
            border:none;
            border-radius:20px;
            background:linear-gradient(90deg,#ff512f,#ff3b30);
            color:white;
            font-size:10px;
            font-weight:bold;
            letter-spacing:1px;
            cursor:pointer;
        }

        .btn:hover{
            opacity:.85;
        }

        /* RIGHT SIDE */

        .signup{
            width:50%;
            background:linear-gradient(135deg,#ff3b30,#ff4035);
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:40px;
        }

        .signup h1{
            font-size:29px;
            margin-bottom:15px;
        }

        .signup p{
            font-size:13px;
            line-height:1.5;
            max-width:250px;
            margin-bottom:23px;
            color:#ffe8e5;
        }

        .signup .btn{
            background:transparent;
            border:1px solid white;
            width:128px;
        }

        .signup .btn:hover{
            background:white;
            color:#ff4035;
        }

        /* RESPONSIVE */

        @media(max-width:800px){

            body{
                padding:20px;
            }

            .container{
                width:100%;
                max-width:600px;
                height:auto;
            }

            .signin,
            .signup{
                padding:40px 25px;
            }
        }

        @media(max-width:600px){

            .container{
                flex-direction:column;
            }

            .signin,
            .signup{
                width:100%;
            }

            .signin{
                min-height:330px;
            }

            .signup{
                min-height:260px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- SIGN IN -->

        <div class="signin">

            <h1>Sign in</h1>

            <div class="social">
                <a href="#">f</a>
                <a href="#">G+</a>
                <a href="#">in</a>
            </div>

            <p class="account-text">
                or use your account
            </p>

            <form onsubmit="login(event)">

                <input
                    class="input"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    class="input"
                    type="password"
                    placeholder="Password"
                    required
                >

                <a href="#" class="forgot">
                    Forgot your password?
                </a>

                <button class="btn" type="submit">
                    SIGN IN
                </button>

            </form>

        </div>


        <!-- SIGN UP -->

        <div class="signup">

            <h1>Hello, Friend!</h1>

            <p>
                Enter your personal details and start
                your journey with us.
            </p>

            <button
                class="btn"
                onclick="signup()">
                SIGN UP
            </button>

        </div>

    </div>


    <script>

        function login(event){

            event.preventDefault();

            alert("Sign in button clicked!");

        }


        function signup(){

            alert("Sign up button clicked!");

        }

    </script>

</body>
</html>
